    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1c2d'/%3E%3Cpath d='M17 18h14c9 0 15 5 15 14S40 46 31 46H17V18Zm11 9h-2v10h2c5 0 8-1 8-5s-3-5-8-5Z' fill='%23f4775a'/%3E%3C/svg%3E" />
    <title>KadeAki — Encontre o que você guardou</title>
    <style>
      :root{--ink:#0b1c2d;--ink-2:#16344d;--paper:#f7f7f2;--cream:#fffdf8;--coral:#f4775a;--coral-dark:#d95740;--mint:#b9e1d4;--line:#d7e0df;--muted:#5b6972;--shadow:0 22px 60px rgba(10,32,47,.12)}
      *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;line-height:1.5} button,a{font:inherit} a{color:inherit;text-decoration:none}.shell{width:min(1120px,calc(100% - 40px));margin:auto}.nav{height:84px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.04em;font-size:1.25rem}.brand-mark{width:31px;height:31px;background:var(--ink);border-radius:9px;display:grid;place-items:center;color:var(--coral);font-weight:900;font-size:1.1rem}.lang-switch{display:flex;gap:3px;padding:4px;border:1px solid var(--line);border-radius:999px;background:#fff}.lang-switch button{border:0;border-radius:999px;background:transparent;color:var(--muted);padding:6px 9px;font-weight:700;font-size:.78rem;cursor:pointer}.lang-switch button[aria-pressed="true"]{background:var(--ink);color:#fff}.hero{padding:42px 0 86px;display:grid;grid-template-columns:1.05fr .95fr;gap:50px;align-items:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);font-size:.88rem;font-weight:800;letter-spacing:.045em;text-transform:uppercase}.eyebrow i{width:9px;height:9px;border-radius:50%;background:var(--coral);display:inline-block}.hero h1{font-size:clamp(3.2rem,6vw,5.65rem);line-height:.94;letter-spacing:-.07em;margin:18px 0 20px;max-width:640px}.hero h1 span{color:var(--coral)}.hero p{font-size:1.15rem;line-height:1.62;color:var(--muted);max-width:495px;margin:0 0 29px}.button{display:inline-flex;gap:10px;align-items:center;justify-content:center;background:var(--coral);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:800;cursor:pointer;box-shadow:0 9px 22px rgba(217,87,64,.23);transition:transform .2s,background .2s}.button:hover{background:var(--coral-dark);transform:translateY(-2px)}.button svg{width:19px;height:19px;fill:currentColor}.hero-visual{position:relative;min-height:500px}.hero-visual:before{content:"";position:absolute;width:82%;height:82%;border-radius:44% 56% 53% 47% / 42% 42% 58% 58%;background:var(--mint);right:0;top:5%;transform:rotate(-8deg)}.hero-visual img{position:absolute;right:5%;bottom:0;width:88%;height:95%;object-fit:cover;border-radius:34px;box-shadow:var(--shadow);filter:saturate(.88)}.float-label{position:absolute;z-index:1;left:0;bottom:14%;padding:13px 17px;background:var(--cream);border-radius:15px;box-shadow:0 12px 35px rgba(10,32,47,.15);font-size:.88rem;font-weight:800}.float-label b{color:var(--coral)}.section{padding:88px 0}.section-kicker{color:var(--coral-dark);font-weight:800;font-size:.86rem;text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px}.section h2{font-size:clamp(2.25rem,4.4vw,3.8rem);line-height:1;letter-spacing:-.055em;margin:0;max-width:620px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:42px}.step{background:var(--cream);border:1px solid rgba(11,28,45,.06);border-radius:20px;padding:28px;min-height:205px}.step-number{font-size:.9rem;font-weight:900;color:var(--coral);margin-bottom:44px}.step h3{font-size:1.25rem;letter-spacing:-.03em;margin:0 0 6px}.step p,.feature p{color:var(--muted);margin:0}.qr-section{background:var(--ink);color:#fff;overflow:hidden}.qr-layout{display:grid;grid-template-columns:1fr 1fr;gap:65px;align-items:center}.qr-section .section-kicker{color:var(--mint)}.qr-card{background:#fff;border-radius:26px;padding:24px;color:var(--ink);transform:rotate(3deg);box-shadow:var(--shadow);max-width:400px;margin:10px auto}.box{background:#e8755b;border-radius:14px;height:230px;position:relative;display:grid;place-items:center;box-shadow:inset 0 -18px 0 rgba(0,0,0,.06)}.box:before{content:"";position:absolute;top:21px;left:10%;right:10%;height:24px;border-radius:9px;background:#d9634c}.qr{width:96px;height:96px;background:repeating-linear-gradient(90deg,#102635 0 7px,#fff 7px 12px),repeating-linear-gradient(#102635 0 7px,#fff 7px 12px);border:8px solid #fff;outline:2px solid #102635;image-rendering:pixelated}.qr-caption{display:flex;align-items:center;justify-content:space-between;font-weight:800;padding:16px 2px 0}.qr-caption span{color:var(--coral-dark);font-size:.82rem}.feature-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:44px}.feature{background:#e9f4f0;border-radius:21px;padding:28px;min-height:195px}.feature:nth-child(2){background:#f9e9e3}.feature:nth-child(3){background:#e8eef3}.feature:nth-child(4){background:#f2efd9}.feature-icon{width:40px;height:40px;border-radius:12px;background:var(--cream);display:grid;place-items:center;margin-bottom:42px;font-size:1.25rem}.feature h3{font-size:1.22rem;letter-spacing:-.025em;margin:0 0 7px}.language-band{display:flex;justify-content:space-between;gap:25px;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:33px 0}.language-band p{margin:0;color:var(--muted)}.languages{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:.9rem;font-weight:700}.download{margin:86px 0 0;background:var(--coral);border-radius:28px;color:#fff;padding:clamp(35px,7vw,78px);display:flex;align-items:center;justify-content:space-between;gap:25px}.download h2{font-size:clamp(2.2rem,4vw,4rem);line-height:.98;letter-spacing:-.06em;margin:0;max-width:540px}.download .button{background:var(--ink);box-shadow:none;white-space:nowrap}.download .button:hover{background:#173c57}.footer{padding:36px 0 47px;color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;gap:20px}.location-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(140deg,#edf5f1,#f7f7f2 55%,#fcece6)}.location-card{width:min(560px,100%);background:var(--cream);border-radius:28px;padding:clamp(28px,7vw,52px);box-shadow:var(--shadow);text-align:center}.location-card .brand{justify-content:center;margin-bottom:38px}.location-icon{width:74px;height:74px;border-radius:23px;background:var(--mint);display:grid;place-items:center;margin:0 auto 22px;font-size:2.15rem}.location-card h1{font-size:clamp(2rem,7vw,3.2rem);letter-spacing:-.055em;line-height:1.02;margin:0 0 14px}.location-card p{color:var(--muted);margin:0 auto 25px;max-width:440px}.location-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:inline-block;background:#edf1f0;border-radius:8px;padding:4px 7px;font-size:.83rem;color:var(--ink-2);word-break:break-all}.location-actions{display:grid;gap:11px;margin-top:28px}.button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}.button.secondary:hover{background:#edf1f0}.location-note{font-size:.82rem;color:var(--muted);margin-top:21px}.invalid .location-icon{background:#f9e0da}.invalid .button.secondary{display:none}@media(max-width:760px){.shell{width:min(100% - 32px,560px)}.nav{height:70px}.hero{grid-template-columns:1fr;padding:30px 0 60px;gap:35px}.hero-visual{min-height:380px;order:-1}.hero-visual img{height:95%;right:3%}.hero h1{font-size:clamp(3.25rem,14vw,4.55rem)}.steps,.qr-layout{grid-template-columns:1fr}.steps{gap:12px;margin-top:29px}.step{min-height:auto;padding:23px}.step-number{margin-bottom:25px}.section{padding:62px 0}.qr-layout{gap:28px}.qr-layout .qr-card{order:2}.feature-grid{grid-template-columns:1fr;gap:12px;margin-top:29px}.feature{min-height:auto;padding:23px}.feature-icon{margin-bottom:25px}.language-band,.download,.footer{align-items:flex-start;flex-direction:column}.download{margin-top:60px}.footer{padding-top:27px}.location-card{border-radius:23px}.float-label{left:-2px;bottom:6%}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="/app-config.js"></script>
    <script>
      const config = window.KADEAKI_CONFIG || {};
      const copy = {
        pt: { locale:'pt_BR', title:'KadeAki — Encontre o que você guardou', desc:'Organize seus objetos por localização e encontre tudo rapidamente com o KadeAki.', hero:'Encontre o que você <span>guardou.</span>', heroText:'Organize seus objetos por localização e encontre tudo rapidamente.', download:'Baixar o KadeAki', howK:'Como funciona', how:'Tudo no seu lugar. De um jeito simples.', steps:[['Cadastre','Organize seus objetos e onde eles estão.'],['Identifique','Use QR Codes para identificar rapidamente suas localizações.'],['Encontre','Pesquise ou escaneie e vá direto ao que procura.']], qrK:'Uma etiqueta, um atalho', qr:'Do QR Code à sua caixa em segundos.', qrText:'Escaneie o QR Code e vá direto para a localização. É um acelerador — não uma exigência.', organize:'Organize do seu jeito', features:[['◫','Caixas, gavetas, armários, garagem, documentos e ferramentas.'],['◉','Tire uma foto e deixe o KadeAki ajudar a identificar o objeto.'],['⌁','Seus dados ficam com você: offline, locais e sem conta obrigatória.'],['◌','Disponível em Português, English e Español.']], featureTitles:['Seus lugares','Reconhecimento no dispositivo','Privacidade offline','Feito para você'], langTitle:'Fale com o KadeAki no idioma que fizer sentido.', installTitle:'Está na hora de encontrar o que você guardou.', footer:'KadeAki · Organização que fica com você', locationTitle:'Esta é uma localização do KadeAki.', locationText:'Abra esta localização pelo KadeAki no seu celular.', open:'Abrir no KadeAki', install:'Baixar na Google Play', invalidTitle:'Localização não encontrada', invalidText:'Esta localização não está disponível neste dispositivo.', invalidNote:'O QR Code só identifica a localização. Os dados permanecem no dispositivo que os criou.', androidNote:'Se o KadeAki já estiver instalado, a câmera deve abrir esta localização automaticamente.' },
        en: { locale:'en_US', title:'KadeAki — Find what you put away', desc:'Organize your things by location and find everything quickly with KadeAki.', hero:'Find what you <span>put away.</span>', heroText:'Organize your things by location and find everything quickly.', download:'Get KadeAki', howK:'How it works', how:'Everything in its place. Simply.', steps:[['Add','Organize your things and where they are.'],['Label','Use QR codes to identify your locations quickly.'],['Find','Search or scan and go straight to what you need.']], qrK:'One label, one shortcut', qr:'From QR code to your box in seconds.', qrText:'Scan the QR code to go directly to the location. It is a shortcut — not a requirement.', organize:'Organize your way', features:[['◫','Boxes, drawers, cabinets, garage, documents and tools.'],['◉','Take a photo and let KadeAki help identify the object.'],['⌁','Your data stays with you: offline, local and with no required account.'],['◌','Available in Português, English and Español.']], featureTitles:['Your places','On-device recognition','Offline privacy','Made for you'], langTitle:'Use KadeAki in the language that suits you.', installTitle:'Time to find what you put away.', footer:'KadeAki · Organization that stays with you', locationTitle:'This is a KadeAki location.', locationText:'Open this location with KadeAki on your phone.', open:'Open in KadeAki', install:'Get it on Google Play', invalidTitle:'Location not found', invalidText:'This location is not available on this device.', invalidNote:'The QR code only identifies the location. Data stays on the device that created it.', androidNote:'If KadeAki is installed, your camera should open this location automatically.' },
        es: { locale:'es_ES', title:'KadeAki — Encuentra lo que guardaste', desc:'Organiza tus objetos por ubicación y encuentra todo rápidamente con KadeAki.', hero:'Encuentra lo que <span>guardaste.</span>', heroText:'Organiza tus objetos por ubicación y encuentra todo rápidamente.', download:'Descargar KadeAki', howK:'Cómo funciona', how:'Todo en su lugar. Sin complicaciones.', steps:[['Registra','Organiza tus objetos y dónde están.'],['Identifica','Usa códigos QR para identificar tus ubicaciones rápidamente.'],['Encuentra','Busca o escanea y ve directamente a lo que necesitas.']], qrK:'Una etiqueta, un atajo', qr:'Del código QR a tu caja en segundos.', qrText:'Escanea el código QR y ve directamente a la ubicación. Es un atajo, no un requisito.', organize:'Organiza a tu manera', features:[['◫','Cajas, cajones, armarios, garaje, documentos y herramientas.'],['◉','Toma una foto y deja que KadeAki ayude a identificar el objeto.'],['⌁','Tus datos se quedan contigo: sin conexión, locales y sin cuenta obligatoria.'],['◌','Disponible en Português, English y Español.']], featureTitles:['Tus lugares','Reconocimiento en el dispositivo','Privacidad sin conexión','Hecho para ti'], langTitle:'Usa KadeAki en el idioma que más te convenga.', installTitle:'Es hora de encontrar lo que guardaste.', footer:'KadeAki · Organización que se queda contigo', locationTitle:'Esta es una ubicación de KadeAki.', locationText:'Abre esta ubicación con KadeAki en tu teléfono.', open:'Abrir en KadeAki', install:'Descargar en Google Play', invalidTitle:'Ubicación no encontrada', invalidText:'Esta ubicación no está disponible en este dispositivo.', invalidNote:'El código QR solo identifica la ubicación. Los datos permanecen en el dispositivo que la creó.', androidNote:'Si KadeAki está instalado, la cámara debería abrir esta ubicación automáticamente.' }
      };
      const detected = (navigator.language || 'en').toLowerCase(); let lang = detected.startsWith('pt') ? 'pt' : detected.startsWith('es') ? 'es' : 'en';
      const playUrl = config.playStoreUrl || 'https://play.google.com/store/search?q=KadeAki&c=apps';
      const icon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3.6v16.8c0 .7.8 1.1 1.3.7L19.7 12 4.3 2.9C3.8 2.6 3 2.9 3 3.6Zm2.2 2 10.9 6.4-10.9 6.4V5.6Z"/></svg>';
      function updateMeta(t){ document.documentElement.lang=lang === 'pt' ? 'pt-BR' : lang; document.title=t.title; document.querySelector('meta[name="description"]').content=t.desc; document.querySelector('meta[property="og:title"]').content=t.title; document.querySelector('meta[property="og:description"]').content=t.desc; document.querySelector('meta[property="og:locale"]').content=t.locale; }
      function brand(){return '<div class="brand"><span class="brand-mark">K</span><span>KadeAki</span></div>'}
      function renderLanding(){const t=copy[lang]; updateMeta(t); document.getElementById('app').innerHTML=`<main><div class="shell"><nav class="nav">${brand()}<div class="lang-switch" aria-label="Language"><button data-lang="pt" aria-pressed="${lang==='pt'}">PT</button><button data-lang="en" aria-pressed="${lang==='en'}">EN</button><button data-lang="es" aria-pressed="${lang==='es'}">ES</button></div></nav><section class="hero"><div><div class="eyebrow"><i></i> KadeAki</div><h1>${t.hero}</h1><p>${t.heroText}</p><a class="button" href="${playUrl}" target="_blank" rel="noopener">${icon}${t.download}</a></div><div class="hero-visual"><img src="/assets/hero-storage.png" alt="" /><div class="float-label"><b>✓</b> &nbsp;${t.organize}</div></div></section></div><section class="section"><div class="shell"><p class="section-kicker">${t.howK}</p><h2>${t.how}</h2><div class="steps">${t.steps.map((s,i)=>`<article class="step"><div class="step-number">0${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join('')}</div></div></section><section class="section qr-section"><div class="shell qr-layout"><div><p class="section-kicker">${t.qrK}</p><h2>${t.qr}</h2><p style="color:#d6e3e5;max-width:470px;font-size:1.08rem;margin-top:21px">${t.qrText}</p></div><div class="qr-card"><div class="box"><div class="qr"></div></div><div class="qr-caption"><span>KADEAKI</span><b>Caixa de Natal</b></div></div></div></section><section class="section"><div class="shell"><p class="section-kicker">${t.organize}</p><h2>${t.features[0][1]}</h2><div class="feature-grid">${t.features.map((f,i)=>`<article class="feature"><div class="feature-icon">${f[0]}</div><h3>${t.featureTitles[i]}</h3><p>${f[1]}</p></article>`).join('')}</div><div class="language-band"><p>${t.langTitle}</p><div class="languages"><span class="pill">Português</span><span class="pill">English</span><span class="pill">Español</span></div></div><section class="download"><h2>${t.installTitle}</h2><a class="button" href="${playUrl}" target="_blank" rel="noopener">${icon}${t.download}</a></section><footer class="footer">${brand()}<span>${t.footer}</span></footer></div></section></main>`; document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;renderLanding()}));}
      function renderLocation(){const t=copy[lang], raw=decodeURIComponent(location.pathname.replace(/^\/location\/?/, '').split('/')[0]||''); const isValid=/^[A-Za-z0-9_-]{3,64}$/.test(raw); updateMeta(t); const appPackage=String(config.androidPackage||'').trim(); const intent=appPackage && isValid ? `intent://location/${encodeURIComponent(raw)}#Intent;scheme=https;package=${encodeURIComponent(appPackage)};end` : null; document.getElementById('app').innerHTML=`<main class="location-page"><section class="location-card ${isValid?'':'invalid'}">${brand()}<div class="location-icon">${isValid?'⌖':'!'}</div><h1>${isValid?t.locationTitle:t.invalidTitle}</h1><p>${isValid?t.locationText:t.invalidText}</p>${isValid?`<span class="location-id">/location/${raw}</span>`:''}<div class="location-actions">${isValid&&intent?`<a class="button" href="${intent}">${t.open}</a>`:''}<a class="button ${isValid&&intent?'secondary':''}" href="${playUrl}" target="_blank" rel="noopener">${t.install}</a></div><p class="location-note">${isValid?(/android/i.test(navigator.userAgent)?t.androidNote:t.locationText):t.invalidNote}</p></section></main>`;}
      location.pathname.startsWith('/location/') ? renderLocation() : renderLanding();
    </script>
  </body>
</html>
